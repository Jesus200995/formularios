<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f5f0f0 50%, #800020 100%);
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        button {
            padding: 12px 24px;
            background: #800020;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 10px 5px;
        }
        button:hover {
            background: #a00028;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 500px;
            overflow-y: auto;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        h1 {
            color: #800020;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test API - Formularios Publicados</h1>
        <p>Prueba del endpoint <code>/api/forms/app/published</code></p>
        
        <div>
            <button onclick="testEndpoint()">🚀 Probar Endpoint</button>
            <button onclick="clearResult()">🗑️ Limpiar</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        const API_URL = 'https://apidata.geodatos.com.mx/api/forms/app/published';
        
        async function testEndpoint() {
            const resultDiv = document.getElementById('result');
            resultDiv.className = '';
            resultDiv.textContent = '⏳ Cargando...';
            
            try {
                console.log('Fetching:', API_URL);
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                resultDiv.className = 'success';
                resultDiv.textContent = `✅ SUCCESS!\n\nTotal de formularios: ${data.length}\n\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                console.error('Error:', error);
                resultDiv.className = 'error';
                resultDiv.textContent = `❌ ERROR!\n\n${error.message}\n\nStack:\n${error.stack}`;
            }
        }
        
        function clearResult() {
            document.getElementById('result').textContent = '';
            document.getElementById('result').className = '';
        }
        
        // Auto test on load
        window.addEventListener('load', () => {
            setTimeout(testEndpoint, 500);
        });
    </script>
</body>
</html>
